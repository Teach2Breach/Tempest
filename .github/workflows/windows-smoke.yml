name: Windows beacon smoke

on:
  push:
    branches: [main, gui-dev, "cursor/**"]
  pull_request:
    branches: [main, gui-dev]
  workflow_dispatch:

jobs:
  win-stargate-e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openssl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Anvil

      - name: Install OpenSSL (MSVC)
        shell: pwsh
        run: |
          choco install openssl.light --no-progress -y
          $root = "C:\Program Files\OpenSSL"
          $libcrypto = Get-ChildItem -Path $root -Recurse -Filter "libcrypto.lib" | Select-Object -First 1
          if (-not $libcrypto) { throw "libcrypto.lib not found under $root" }
          echo "OPENSSL_DIR=$root" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$($libcrypto.DirectoryName)" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$root\include" >> $env:GITHUB_ENV

      - name: Run Windows smoke script
        shell: pwsh
        run: ./scripts/windows-beacon-smoke.ps1
