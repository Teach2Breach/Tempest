[[users]]
username = "forge"
password = "forge"

[cert]
private_key = "/path/to/cert/key.pem"
certificate = "/path/to/cert/cert.pem"

[crypt]
LITCRYPT_ENCRYPT_KEY = "ageofmachine"

[server]
implant_port = 443
conduit_port = 8443
# Max rows in `outputs` (team buffer after C.9). 0 = no automatic pruning. See `routes::prune_outputs_if_needed`.
outputs_max_rows = 0

[build]
toolchain = "nightly-2025-03-03"